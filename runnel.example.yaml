# runnel configuration file
# Safe loopback defaults with comprehensive documentation for all configuration fields.
#
# NOTE: runnel is designed as an internal egress gateway, NOT a public open proxy.
# Do not bind to 0.0.0.0 or expose to untrusted networks without upstream domain
# restrictions (allowed_domains) and appropriate network access controls.

server:
  # Host IP address to bind HTTP listener. Defaults to loopback to prevent exposing administrative
  # endpoints or creating an open proxy.
  host: "127.0.0.1"

  # TCP port for the HTTP server.
  port: 8090

  # Maximum duration in seconds for reading the entire incoming request including headers and body.
  read_timeout_sec: 15

  # Maximum duration in seconds before timing out writes of the response (and upstream fetches).
  write_timeout_sec: 30

  # Maximum allowed request body size in bytes (default 10 MB = 10485760 bytes).
  max_body_bytes: 10485760

security:
  # When true, blocks private, loopback, multicast, and link-local IPv4/IPv6 addresses
  # to protect internal infrastructure against SSRF (Server-Side Request Forgery).
  block_private_ips: true

  # When true, answers HTTP OPTIONS preflight requests with CORS headers allowing cross-origin clients.
  enable_cors: true

  # Allowed domain whitelist (exact domains or wildcard prefixes like "*.example.com").
  # When empty ([]), all domains are permitted subject to SSRF IP validation.
  allowed_domains: []

  # Bearer / X-Admin-Token secret for administrative mutations (e.g. POST /_circuit/reset).
  # If empty in YAML, runnel falls back to the RUNNEL_ADMIN_TOKEN environment variable.
  # If neither is set, administrative mutations are rejected (403 Forbidden).
  admin_token: ""

storage:
  # Path to SQLite database file used for durable caching and circuit history.
  db_path: "./data/runnel.db"

  # Interval in seconds between background cache cleanup runs.
  cache_cleanup_interval_sec: 3600

  # Maximum cache storage budget in megabytes before LRU eviction triggers.
  max_cache_size_mb: 500

  # Maximum number of pending dirty cache writes batched in a single SQLite transaction.
  write_batch_size: 50

  # Flush interval in milliseconds for asynchronous SQLite writer commits.
  write_flush_interval_ms: 100

defaults:
  # Initial cooldown period in seconds when a domain enters OPEN circuit state (default 5m).
  cooldown_initial_sec: 300

  # Multiplier applied to cooldown duration on consecutive circuit trips (exponential backoff).
  cooldown_multiplier: 2.0

  # Upper limit in seconds for exponential circuit cooldown (default 2 hours = 7200s).
  cooldown_max_sec: 7200

  # Sustained rate limit in requests per second allowed per upstream domain.
  requests_per_sec: 0.5

  # Minimum random jitter delay in milliseconds added between outgoing domain requests.
  jitter_min_ms: 200

  # Maximum random jitter delay in milliseconds added between outgoing domain requests.
  jitter_max_ms: 800

  # Maximum number of pending requests buffered per domain queue while circuit is OPEN or rate-limited.
  queue_max_size: 200

  # Maximum duration in seconds a request can wait in the domain queue before failing with 503 + Retry-After.
  queue_timeout_sec: 15

  # When true, immediately serves stale cached responses (Warning: 110) while circuit is OPEN.
  serve_stale_on_open: true

  # Default Time-To-Live in seconds for cached HTTP 2xx GET/HEAD responses.
  default_cache_ttl_sec: 3600

  # Canary probe strategy to test upstream recovery when circuit enters HALF-OPEN.
  # Options: "headers_only" (strips non-essential headers) or "query_param" (appends probe marker).
  probe_strategy: "headers_only"

# Optional per-domain policy overrides matching specific hostnames or wildcards (*.domain.com).
# Exact hostname matches take precedence over wildcard patterns.
domains:
  - match: "*.github.com"
    cooldown_initial_sec: 60
    cooldown_multiplier: 2.0
    cooldown_max_sec: 1800
    requests_per_sec: 1.0
    jitter_min_ms: 100
    jitter_max_ms: 400
    queue_max_size: 100
    queue_timeout_sec: 10
    probe_strategy: "headers_only"
    auth_cookies:
      - "user_session"

  - match: "api.example.com"
    cooldown_initial_sec: 120
    cooldown_multiplier: 1.5
    cooldown_max_sec: 3600
    requests_per_sec: 2.0
    jitter_min_ms: 50
    jitter_max_ms: 250
    queue_max_size: 300
    queue_timeout_sec: 20
    probe_strategy: "query_param"
    auth_cookies:
      - "session_id"
